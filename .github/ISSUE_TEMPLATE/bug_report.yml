name: Bug report
description: Something doesn't load, save or edit correctly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: game-version
    attributes:
      label: Game version
      description: Shown in the app's Overview page, for example "7.38 · build 737790".
    validations:
      required: true
  - type: checkboxes
    id: dlcs
    attributes:
      label: DLCs in this save
      options:
        - label: Spaced Out!
        - label: Frosty Planet
        - label: Bionic Booster
        - label: Prehistoric Planet
        - label: Aquatic Planet
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 on Windows 11
  - type: textarea
    id: save
    attributes:
      label: Save file
      description: If you can share it, zip the `.sav` and drag it here. It is only used to reproduce the bug.
