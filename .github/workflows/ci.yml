name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '24'
          cache: true

      - run: vp install

      # PRs fetch the small tier unless they change the manifest; everything else fetches all.
      - name: Choose fixture tier
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git diff --quiet HEAD^1 HEAD -- test-data/fixtures.json; then
            tier=small
          else
            tier=all
          fi
          echo "Fixture tier: $tier"
          echo "FIXTURE_TIER=$tier" >> "$GITHUB_ENV"

      - name: Restore fetched fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-data/fetched
          key: fixtures-${{ env.FIXTURE_TIER }}-${{ hashFiles('test-data/fixtures.json') }}
          restore-keys: |
            fixtures-all-${{ hashFiles('test-data/fixtures.json') }}

      - name: Fetch and verify fixtures
        run: vp run fixtures --tier "$FIXTURE_TIER"

      - run: vp check

      - run: vp test

      - name: Restore differential oracle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/oracle
          key: oracle-${{ hashFiles('scripts/differential/oracle.ts') }}

      # Compares every fixture against konove's oni-save-parser, built from source at a pinned commit.
      - name: Differential test against oni-save-parser
        run: vp run differential --tier "$FIXTURE_TIER"

      - name: Build app and pack libraries
        run: vp run -r build

      # End-to-end: load a fixture in Chromium, edit through the UI, download, re-parse.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        working-directory: apps/web
        run: vp exec playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: apps/web
        run: vp exec playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
