packages:
  - apps/*
  - packages/*
  - tools/*
  - apps/apps/*

catalogMode: prefer

catalog:
  '@dnd-kit/core': ^6.3.1
  '@dnd-kit/modifiers': ^9.0.0
  '@dnd-kit/sortable': ^10.0.0
  '@dnd-kit/utilities': ^3.2.2
  '@fontsource-variable/geist': ^5.3.0
  '@fontsource-variable/jetbrains-mono': ^5.3.0
  '@fontsource-variable/noto-sans': ^5.2.0
  '@fontsource/rajdhani': ^5.2.0
  '@oni-duplicity/game-data': workspace:*
  '@oni-duplicity/save-parser': workspace:*
  '@onimaxxing/worldgen': 0.33.4
  '@playwright/test': ^1.64.1
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/react-table': ^9.2.4
  '@tanstack/react-virtual': ^3.14.25
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.8
  '@types/node': ^26
  class-variance-authority: ^0.7.1
  cmdk: ^1.1.1
  cn: ^0.5.2
  comlink: ^4.4.2
  fflate: ^0.8.3
  happy-dom: ^21.0.4
  lucide-react: ^1.66.0
  radix-ui: ^1.8.1
  react-oni-duplicant: 0.1.3
  recharts: 3.10.1
  shadcn: ^4.23.0
  sonner: ^2.0.8
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vaul: ^1.1.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  zod: ^4.6.7
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
allowBuilds:
  # Its postinstall only prints a donation message.
  jss: false
